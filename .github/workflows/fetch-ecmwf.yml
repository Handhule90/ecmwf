
name: ECMWF Forecast Fetcher

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install required packages
        run: pip install ecmwf-opendata eccodes numpy

      - name: Test ECMWF ensemble track availability
        run: python test_ensemble.py

      - name: Decode ensemble tracks
        run: python decode_ensemble.py

      - name: Inspect ensemble BUFR structure
        run: python inspect_ensemble.py

      - name: Inspect ensemble track values
        run: python inspect_ensemble.py

      - name: Fetch latest tropical cyclone tracks
        run: python fetch_ecmwf.py

      - name: Decode deterministic forecast tracks
        run: python decode_tracks.py

      - name: Save downloaded data
        uses: actions/upload-artifact@v4
        with:
          name: ecmwf-track-data
          path: |
            ecmwf-track.bufr
            storms.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish storms.json to Neocities
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: |
          curl --fail-with-body \
            -H "Authorization: Bearer $NEOCITIES_API_KEY" \
            -F "newiconshu/ecmwf/storms.json=@storms.json" \
            https://neocities.org/api/upload
